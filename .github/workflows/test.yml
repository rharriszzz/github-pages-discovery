name: Unit tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -VV
      - run: python -m unittest discover -s tests -v
      - run: python -m pagefinder report
      - run: python -m pagefinder.publication
      - run: git diff --exit-code -- docs/index.html reports/results.csv reports/results.json
